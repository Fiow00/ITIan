{% extends "pages/base.html" %}

{% block title %}
    Trainee add
{% endblock title %}

{% block content %}
    <h1>Add Trainee</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
            <div>
                {{ field.label }}
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}
        <input type="submit" value="Add">
    </form>

{% endblock content %}
