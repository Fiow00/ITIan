{% extends "pages/base.html" %}

{% block title %}
    Course list
{% endblock title %}

{% block content %}
    <h1>Course list</h1>

    <table border="1">
        <tr>
            <th>Id</th>
            <th>Title</th>
        </tr>
        {% for course in courses %}
            <tr>
                <td>{{ course.id }}</td>
                <td>{{ course.title }}</td>
            </tr>
        {% endfor %}
    </table>
{% endblock content %}
